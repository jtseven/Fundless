[project]
name = "fundless"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "aenum>=3.1.15",
    "ccxt>=4.4.23",
    "dash>=2.18.1",
    "flask>=3.0.3",
    "flask-login>=0.6.3",
    "pandas>=2.2.3",
    "pathlib>=1.0.1",
    "plotly>=5.24.1",
    "pycoingecko>=3.1.0",
    "python-telegram-bot[job-queue]>=21.6",
    "pyyaml>=6.0.2",
    "redo>=3.0.0",
    "schedule>=1.2.2",
    "dash-bootstrap-components>=1.6.0",
    "python-dotenv>=1.0.1",
    "authlib>=1.3.2",
    "dash-extensions>=1.0.18",
    "currencyconverter>=0.17.33",
    "pydantic>=2.9.2",
    "coloredlogs>=15.0.1",
    "gevent>=24.10.3",
    "sqlmodel>=0.0.22",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.uv]
dev-dependencies = [
    "ruff>=0.4.10",
]

[tool.uv.sources]
pydantic = { git = "https://github.com/pydantic/pydantic.git" }

[project.scripts]
fundless = "fundless.__main__:main"

[tool.ruff]
line-length = 110
indent-width = 4

[tool.ruff.lint]
# On top of the default `select` (`E4`, E7`, `E9`, and `F`), enable flake8-bugbear (`B`) and flake8-quotes (`Q`).
extend-select = ["I"]
